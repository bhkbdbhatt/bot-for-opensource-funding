# -----------------------------------------------------------------------------
# Rate limits (per local calendar day, persisted in the tracker)
# -----------------------------------------------------------------------------
rate_limits:
  max_emails_per_day: 15
  max_forum_posts_per_day: 3
  # Extra safety: never send two messages to the same sponsor within N hours.
  min_hours_between_attempts: 72
  # Stop the scheduler after this many consecutive send failures.
  max_consecutive_failures: 5

# -----------------------------------------------------------------------------
# Scheduler
# -----------------------------------------------------------------------------
scheduler:
  interval_seconds: 7200     # cron-like: every 2 hours
  batch_size: 5              # sponsors per tick
  dry_run: false             # true = generate + log, never transmit
  # Optional: hand the rendered prompt to a local CLI tool instead of using the
  # built-in composer. The command receives the prompt on stdin and must print
  # the final message on stdout. Example: ["ollama", "run", "llama3.1"]
  llm_command: []
  llm_timeout_seconds: 120

# -----------------------------------------------------------------------------
# Paths / logging
# -----------------------------------------------------------------------------
paths:
  tracker_file: "sponsors.json"
  discovery_cache: "discovered.json"
  log_file: "bot.log"
  log_level: "INFO"
  log_max_bytes: 2097152
  log_backup_count: 3